name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, intl, bcmath, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci

      - run: vendor/bin/pint --test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Pest
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Cloudways secrets live in this GitHub environment.
    environment: production
    env:
      SSH_HOST: ${{ secrets.CLOUDWAYS_SSH_HOST }}
      SSH_USER: ${{ secrets.CLOUDWAYS_SSH_USER }}
      APP_PATH: ${{ secrets.CLOUDWAYS_APP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: npm ci
      - run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CLOUDWAYS_SSH_KEY }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER APP_PATH SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The CLOUDWAYS_$name secret is empty or missing."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null; then
            echo "::error::CLOUDWAYS_SSH_KEY is not a valid private key. Paste the whole file, including the BEGIN and END lines."
            exit 1
          fi

          ssh-keyscan -T 20 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2> /dev/null || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not reach the server in CLOUDWAYS_SSH_HOST on port 22."
            exit 1
          fi

          if ! ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" true; then
            echo "::error::The server refused the login. Check CLOUDWAYS_SSH_USER and that the public key is added in Cloudways."
            exit 1
          fi
      - name: Sync files
        run: |
          # Not -a: the deploy user doesn't own public_html itself, so rsync
          # can't set its permissions or times. New files get group-writable
          # modes so PHP-FPM (same www-data group) can use them.
          rsync -rltz --omit-dir-times --chmod=D2775,F664 --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='/storage/' \
            --exclude='/public/storage' \
            --exclude='/bootstrap/cache/*.php' \
            ./ "$SSH_USER@$SSH_HOST:$APP_PATH/"

      - name: Migrate and cache
        run: |
          # The server's default CLI PHP is 8.2; the app runs on 8.3.
          ssh "$SSH_USER@$SSH_HOST" "cd '$APP_PATH' && umask 002 \
            && mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache \
            && chmod -R ug+rwX storage bootstrap/cache \
            && find storage bootstrap/cache -type d -exec chmod g+s {} + \
            && php8.3 artisan migrate --force \
            && php8.3 artisan storage:link --force \
            && php8.3 artisan optimize \
            && php8.3 artisan queue:restart"

      - name: Health check
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://plan.dustindellinger.com/health
